name: Keyboard navigation checks

on:
  push:
    branches: ['feat/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app
      - name: Test
        run: swift test
      - name: Build and package
        run: |
          ./build-app.sh
          ditto -c -k --sequesterRsrc --keepParent Cheetos.app Cheetos-keyboard-navigation.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Cheetos-keyboard-navigation
          path: Cheetos-keyboard-navigation.zip
